name: Version 3 Background Jobs

on:
  workflow_dispatch:
  schedule:
    # Respectful daily SEC/model readiness check, separate from market analysis.
    - cron: "15 12 * * 1-5"
    # Weekly calibration hook; never every 30 minutes.
    - cron: "0 14 * * 6"

concurrency:
  group: v2-background-jobs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sec-sync-status:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: SEC sync readiness
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -c "from app.services.jobs import sec_sync_job_status; print(sec_sync_job_status())"

  model-validation-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Model registry and methodology report
        run: |
          python -c "from app.services.model_registry import registry_as_dict; print(registry_as_dict())"
          python main.py --model-report
