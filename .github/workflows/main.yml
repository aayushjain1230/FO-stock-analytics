name: Version 2 Watchlist Intelligence

on:
  schedule:
    # Once after market close on weekdays. Avoid aggressive polling or committing runtime state.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: watchlist-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily-brief:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Analyze watchlist and send daily brief when configured
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python main.py --analyze --send-telegram

      - name: Upload V2 analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-watchlist-analysis
          path: state/v2_latest_analysis.json
          if-no-files-found: warn
