name: Watchlist Intelligence Daily Run

on:
  schedule:
    # Once after market close on weekdays. Avoid aggressive polling or committing runtime state.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      watchlist:
        description: "Comma-separated tickers, for example AAPL,MSFT,NVDA"
        required: false
        type: string
      send_telegram:
        description: "Send the Telegram brief"
        required: true
        default: false
        type: boolean
      sync_sec:
        description: "Synchronize SEC filings"
        required: true
        default: true
        type: boolean
      export_report:
        description: "Generate a static HTML report artifact"
        required: true
        default: true
        type: boolean

concurrency:
  group: watchlist-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily-brief:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
      WATCHLIST_TICKERS: ${{ vars.WATCHLIST_TICKERS }}
      MANUAL_WATCHLIST: ${{ github.event.inputs.watchlist }}
      SCHEDULED_SEND_TELEGRAM: ${{ vars.SCHEDULED_SEND_TELEGRAM }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Analyze selected watchlist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.sync_sec }}" = "true" ]; then EXTRA_FLAGS="$EXTRA_FLAGS --sync-sec"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then EXTRA_FLAGS="$EXTRA_FLAGS --sync-sec"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_telegram }}" = "true" ]; then EXTRA_FLAGS="$EXTRA_FLAGS --send-telegram"; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$SCHEDULED_SEND_TELEGRAM" = "true" ]; then EXTRA_FLAGS="$EXTRA_FLAGS --send-telegram"; fi
          python main.py --analyze --tickers "$MANUAL_WATCHLIST" $EXTRA_FLAGS

      - name: Export optional static report
        if: ${{ github.event_name == 'schedule' || inputs.export_report }}
        run: python main.py --export-report --tickers "$MANUAL_WATCHLIST"

      - name: Upload watchlist artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-intelligence-${{ github.run_id }}-${{ github.sha }}
          path: |
            state/v2_latest_analysis.json
            reports/watchlist_report.html
          if-no-files-found: warn
